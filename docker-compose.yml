services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: srip
      POSTGRES_USER: srip
      POSTGRES_PASSWORD: srip
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://srip:srip@db:5432/srip
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_PATH=/app/storage
    depends_on:
      - db
      - redis

  frontend:
    build: ./frontend
    ports:
      - "3000:80"

volumes:
  postgres_data:
  minio_data:
